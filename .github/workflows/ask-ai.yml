name: Ask AI
on:
  workflow_dispatch:

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: AI Inference
        id: ai-response
        uses: actions/ai-inference@v2
        with:
          prompt: |
            Give me a programming joke.
          # model: ""
        # env:
        #   COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
      - name: Display AI Response
        run: |
          echo "## 🤖 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.ai-response.outputs.response }}" >> $GITHUB_STEP_SUMMARY
      - name: Use Response File
        run: |
          echo "Response saved to: ${{ steps.ai-response.outputs.response-file }}"
          cat "${{ steps.ai-response.outputs.response-file }}"
